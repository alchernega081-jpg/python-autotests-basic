name: Run Autotests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pytest selenium requests

      - name: Run tests
        working-directory: "Video 1/src/finaly_project/major_test_suit/test_bonus_flow_system.py"
        run: |
          pytest . -v