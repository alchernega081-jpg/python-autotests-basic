name: Run Autotests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.10'
          auto-activate: false # Исправлено с устаревшего auto-activate-base

      - name: Create environment and install dependencies
        run: |
          # Инициализация conda для текущей оболочки
          conda init bash
          # Источник (source) нужен, чтобы команды conda стали доступны в текущем скрипте
          source ~/.bashrc
          
          # Теперь активация сработает
          conda activate Video_1
          
          # Установка selenium и менеджера драйверов через pip (для Linux)
          pip install webdriver-manager

      - name: Run tests
        working-directory: Video 1/src/finaly_project
        shell: bash -l {0}
        run: |
          pytest . -v --alluredir=allure-results

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: Video 1/src/finaly_project/allure-results/ # Путь исправлен под working-directory
