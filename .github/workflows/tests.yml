name: Run Autotests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.10'
          auto-activate: false # Исправлено с устаревшего auto-activate-base

      - name: Create environment and install dependencies
        run: |
          conda init bash
          source ~/.bashrc
          conda env create -f "Video 1/environment.yml"
          conda activate Video_1
          pip install webdriver-manager
          
          # Установка selenium и менеджера драйверов через pip (для Linux)
          pip install webdriver-manager

      - name: Run tests
        # Переходим в папку, где лежат сами .py файлы
        working-directory: Video 1/src/finaly_project/major_test_suit
        run: |
          # Инициализация и активация
          conda init bash
          source ~/.bashrc
          conda activate Video_1

          # Используем прямой путь к pytest
          /home/runner/miniconda3/envs/Video_1/bin/pytest . -v --alluredir=allure-results

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          # Путь исправлен согласно новому working-directory
          path: Video 1/src/finaly_project/major_test_suit/allure-results/
