[pytest]
addopts = --maxfail=2 --junit-xml=junit.xml --alluredir=allure_results

[flake8]
max-line-length = 120
select = E, W
exclude =
    .venv,
    .venv1,
    venv,
    .env,
    env,
    __pycache__,
    .git,
    build,
    dist
ignore = E501, W503, E203, E402, E401, F401, E241, E226, E704, E301, F821, E128, E111, E261, E114, E116, E265
filename =
   filename =
    tests/**/*.py,
    src/tests/**/*.py,
    src/accounts/**/*.py