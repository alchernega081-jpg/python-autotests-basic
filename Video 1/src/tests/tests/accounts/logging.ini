[loggers]
keys=root,console,file,request

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=commonFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler,fileHandler

[logger_console]
level=INFO
handlers=consoleHandler
qualname=console
propagate=0

[logger_file]
level=DEBUG
handlers=fileHandler
qualname=file
propagate=0

[logger_request]
level=DEBUG
handlers=fileHandler,consoleHandler
qualname=request
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=commonFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=DEBUG
formatter=commonFormatter
args=('request.txt', 'a', 'utf-8')

[formatter_commonFormatter]
format=[%(asctime)s][%(levelname)s][%(name)s] %(message)s
datefmt=%Y-%m-%d %H:%M:%S